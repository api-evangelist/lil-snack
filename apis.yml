aid: lil-snack
name: Lil Snack
description: >-
  Lil Snack is a Manhattan Beach, California games company, founded in 2024, that
  builds "snackable" daily games and party games — short pop-culture puzzle,
  word, and trivia titles that refresh every day. It runs its own consumer
  destination at lilsnack.com (Clue Daily, Scattergories Daily, Swap, DownWords,
  Pickle, Lite Brite Daily, Wheel of Fortune TODAY, Quiz Climb, Venn, Chain, and
  more) and also powers games embedded inside partner consumer platforms,
  citing BuzzFeed, FOX, Hasbro, the Los Angeles Times, Netflix, Peacock, Prime
  Gaming, Reddit, and Sony. The company reports 40M+ games played and 10M+
  players all-time, and monetizes through platform partnerships, sponsorships,
  and brand licensing. As of this profile Lil Snack publishes NO public
  developer surface — no API, no documentation portal, no SDKs, no public GitHub
  organization, and no /.well-known documents; its partner game integrations are
  arranged through business development rather than self-serve APIs. This
  API Evangelist profile therefore captures verified company identity, web
  properties, and probed domain-security posture only.
